/* ==========================================================================
   5. DYNAMIC STATS COUNTER ACTION
   ========================================================================== */
function initStatsCounter() {
  const statNumElements = document.querySelectorAll('.stat-num');
  
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        const target = entry.target;
        const targetValAttr = target.innerText;
        
        if (target.id === 'stat-year') return;
        
        const isPercent = targetValAttr.includes('%');
        const isPlus = targetValAttr.includes('+');
        const rawVal = parseInt(targetValAttr.replace(/[^0-9]/g, ''));
        
        animateCount(target, rawVal, isPercent, isPlus);
        observer.unobserve(target);
      }
    });
  }, { threshold: 0.5 });
  
  statNumElements.forEach(el => observer.observe(el));
}

function animateCount(element, targetVal, isPercent, isPlus) {
  let currentVal = 0;
  const duration = 1200;
  const stepTime = Math.max(10, Math.floor(duration / targetVal));
  
  const timer = setInterval(() => {
    currentVal++;
    element.innerText = currentVal + (isPercent ? '%' : '') + (isPlus ? '+' : '');
    
    if (currentVal >= targetVal) {
      clearInterval(timer);
      element.innerText = targetVal + (isPercent ? '%' : '') + (isPlus ? '+' : '');
    }
  }, stepTime);
}

/* ==========================================================================
   6. INTERACTIVE 3D BIM & CLASH DETECTION SIMULATOR
   ========================================================================== */
function initBimSimulator() {
  const canvas = document.getElementById('bimCanvas');
  if (!canvas) return;
  
  const ctx = canvas.getContext('2d');
  const scanline = document.getElementById('bimScanline');
  const hudStatus = document.getElementById('bimHudStatus');
  const consoleBody = document.getElementById('bimLogConsole');
  
  const togglePlumb = document.getElementById('bimTogglePlumbing');
  const toggleHvac = document.getElementById('bimToggleHvac');
  const toggleElec = document.getElementById('bimToggleElec');
  
  const btnRun = document.getElementById('bimBtnRun');
  const btnReset = document.getElementById('bimBtnReset');
  
  if (!scanline || !hudStatus || !consoleBody || !togglePlumb || !toggleHvac || !toggleElec || !btnRun || !btnReset) return;
  
  window.tcsBimState = {
    state: 'idle',
    progress: 0,
    pipeOffset: 0,
    elecOffset: 0,
    scale: 1,
    logsPrinted: new Set()
  };
  
  function resizeCanvas() {
    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    ctx.scale(dpr, dpr);
    window.tcsBimState.width = rect.width;
    window.tcsBimState.height = rect.height;
  }
  
  window.tcsBimState.resize = resizeCanvas;
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();
  
  function toIso(x, y, z) {
    const cx = window.tcsBimState.width / 2;
    const cy = window.tcsBimState.height / 2 - 10;
    const isoX = cx + (x - y) * 0.866;
    const isoY = cy + (x + y) * 0.5 - z;
    return { x: isoX, y: isoY };
  }
  
  function drawIsoPillar(x, y, h) {
    ctx.fillStyle = 'rgba(30, 41, 59, 0.4)';
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
    ctx.lineWidth = 1;
    
    const w = 15;
    const bottom = toIso(x, y, 0);
    const top = toIso(x, y, h);
    
    ctx.beginPath();
    ctx.moveTo(toIso(x - w, y - w, 0).x, toIso(x - w, y - w, 0).y);
    ctx.lineTo(toIso(x + w, y - w, 0).x, toIso(x + w, y - w, 0).y);
    ctx.lineTo(toIso(x + w, y + w, 0).x, toIso(x + w, y + w, 0).y);
    ctx.lineTo(toIso(x - w, y + w, 0).x, toIso(x - w, y + w, 0).y);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    
    ctx.beginPath();
    ctx.moveTo(bottom.x, bottom.y);
    ctx.lineTo(top.x, top.y);
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
    ctx.stroke();
  }
  
  function drawIsoBox(x, y, z, wx, wy, wz, colorGradients) {
    const p1 = toIso(x, y, z);
    const p2 = toIso(x + wx, y, z);
    const p3 = toIso(x + wx, y + wy, z);
    const p4 = toIso(x, y + wy, z);
    const p5 = toIso(x, y, z + wz);
    const p6 = toIso(x + wx, y, z + wz);
    const p7 = toIso(x + wx, y + wy, z + wz);
    const p8 = toIso(x, y + wy, z + wz);
    
    ctx.fillStyle = colorGradients.top;
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
    ctx.lineWidth = 0.5;
    ctx.beginPath();
    ctx.moveTo(p5.x, p5.y);
    ctx.lineTo(p6.x, p6.y);
    ctx.lineTo(p7.x, p7.y);
    ctx.lineTo(p8.x, p8.y);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    
    ctx.fillStyle = colorGradients.left;
    ctx.beginPath();
    ctx.moveTo(p1.x, p1.y);
    ctx.lineTo(p5.x, p5.y);
    ctx.lineTo(p8.x, p8.y);
    ctx.lineTo(p4.x, p4.y);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    
    ctx.fillStyle = colorGradients.right;
    ctx.beginPath();
    ctx.moveTo(p2.x, p2.y);
    ctx.lineTo(p6.x, p6.y);
    ctx.lineTo(p7.x, p7.y);
    ctx.lineTo(p3.x, p3.y);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
  }
  
  function drawIsoTube(x1, y1, z1, x2, y2, z2, radius, color, glowColor) {
    const start = toIso(x1, y1, z1);
    const end = toIso(x2, y2, z2);
    
    ctx.strokeStyle = color;
    ctx.lineWidth = radius * 2;
    ctx.lineCap = 'round';
    
    if (glowColor) {
      ctx.shadowColor = glowColor;
      ctx.shadowBlur = 8;
    }
    
    ctx.beginPath();
    ctx.moveTo(start.x, start.y);
    ctx.lineTo(end.x, end.y);
    ctx.stroke();
    ctx.shadowBlur = 0;
  }
  
  function drawClashNode(x, y, z, label, active) {
    const pt = toIso(x, y, z);
    const currentLang = localStorage.getItem('tcs_lang') || 'id';
    
    if (active) {
      const pulseRadius = 8 + Math.sin(Date.now() / 150) * 4;
      ctx.fillStyle = 'rgba(239, 68, 68, 0.25)';
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, pulseRadius + 6, 0, Math.PI * 2);
      ctx.fill();
      
      ctx.fillStyle = '#ef4444';
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, 6, 0, Math.PI * 2);
      ctx.fill();
      
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, 6, 0, Math.PI * 2);
      ctx.stroke();
      
      ctx.fillStyle = '#f87171';
      ctx.font = 'bold 8px Courier New';
      ctx.fillText(label, pt.x + 10, pt.y - 4);
    } else {
      ctx.fillStyle = 'rgba(0, 229, 117, 0.2)';
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, 10, 0, Math.PI * 2);
      ctx.fill();
      
      ctx.fillStyle = '#00e575';
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, 4, 0, Math.PI * 2);
      ctx.fill();
      
      ctx.fillStyle = '#a7f3d0';
      ctx.font = 'bold 7px Courier New';
      ctx.fillText(currentLang === 'en' ? 'OK' : 'AMAN', pt.x + 8, pt.y - 4);
    }
  }
  
  function addConsoleLine(logKey, type) {
    const currentLang = localStorage.getItem('tcs_lang') || 'id';
    const translation = window.TCS_TRANSLATIONS ? window.TCS_TRANSLATIONS[logKey] : null;
    const text = translation ? translation[currentLang] : logKey;
    
    if (window.tcsBimState.logsPrinted.has(logKey)) return;
    window.tcsBimState.logsPrinted.add(logKey);
    
    const lineEl = document.createElement('div');
    lineEl.className = `console-line ${type}`;
    lineEl.innerText = `> ${text}`;
    
    consoleBody.appendChild(lineEl);
    consoleBody.scrollTop = consoleBody.scrollHeight;
  }
  
  function clearConsole() {
    consoleBody.innerHTML = '';
    window.tcsBimState.logsPrinted.clear();
  }
  
  function render() {
    ctx.clearRect(0, 0, window.tcsBimState.width, window.tcsBimState.height);
    
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.02)';
    ctx.lineWidth = 0.5;
    for (let i = -160; i <= 160; i += 40) {
      ctx.beginPath();
      const p1 = toIso(i, -160, 0);
      const p2 = toIso(i, 160, 0);
      ctx.moveTo(p1.x, p1.y);
      ctx.lineTo(p2.x, p2.y);
      ctx.stroke();
      
      ctx.beginPath();
      const p3 = toIso(-160, i, 0);
      const p4 = toIso(160, i, 0);
      ctx.moveTo(p3.x, p3.y);
      ctx.lineTo(p4.x, p4.y);
      ctx.stroke();
    }
    
    drawIsoPillar(-120, -120, 80);
    drawIsoPillar(-120, 120, 80);
    drawIsoPillar(120, -120, 80);
    drawIsoPillar(120, 120, 80);
    
    if (window.tcsBimState.state === 'scanning') {
      window.tcsBimState.progress += 0.006;
      if (window.tcsBimState.progress >= 1) {
        window.tcsBimState.progress = 1;
        window.tcsBimState.state = 'resolved';
        
        hudStatus.className = 'bim-hud-status-badge clean';
        hudStatus.setAttribute('data-translate', 'bim_status_clean');
        const currentLang = localStorage.getItem('tcs_lang') || 'id';
        if (window.TCS_TRANSLATIONS && window.TCS_TRANSLATIONS['bim_status_clean']) {
          hudStatus.innerText = window.TCS_TRANSLATIONS['bim_status_clean'][currentLang];
        } else {
          hudStatus.innerText = currentLang === 'en' ? '✓ Zero-Clash' : '✓ Bebas Bentrokan';
        }
        
        btnRun.style.display = 'none';
        btnReset.style.display = 'inline-block';
        scanline.classList.remove('scanning');
      }
      
      window.tcsBimState.pipeOffset = Math.min(1, window.tcsBimState.progress * 1.3);
      window.tcsBimState.elecOffset = Math.min(1, window.tcsBimState.progress * 1.1);
      
      if (window.tcsBimState.progress > 0.05) addConsoleLine('bim_log_1', 'system');
      if (window.tcsBimState.progress > 0.20) addConsoleLine('bim_log_2', 'scan');
      if (window.tcsBimState.progress > 0.35) addConsoleLine('bim_log_3', 'warn');
      if (window.tcsBimState.progress > 0.50) addConsoleLine('bim_log_4', 'warn');
      if (window.tcsBimState.progress > 0.65) addConsoleLine('bim_log_5', 'system');
      if (window.tcsBimState.progress > 0.78) addConsoleLine('bim_log_6', 'resolve');
      if (window.tcsBimState.progress > 0.88) addConsoleLine('bim_log_7', 'resolve');
      if (window.tcsBimState.progress >= 0.98) addConsoleLine('bim_log_8', 'resolve');
    }
    
    if (toggleHvac.checked) {
      drawIsoBox(
        -100, -60, 40,
        200, 40, 25,
        {
          top: 'rgba(0, 229, 117, 0.15)',
          left: 'rgba(0, 229, 117, 0.1)',
          right: 'rgba(0, 229, 117, 0.2)'
        }
      );
    }
    
    if (togglePlumb.checked) {
      const zOffset = window.tcsBimState.pipeOffset * 35;
      drawIsoTube(-140, -40, 30, -50, -40, 30 + zOffset, 3.5, '#00f2fe', 'rgba(0, 242, 254, 0.3)');
      drawIsoTube(-50, -40, 30 + zOffset, 50, -40, 30 + zOffset, 3.5, '#00f2fe', 'rgba(0, 242, 254, 0.3)');
      drawIsoTube(50, -40, 30 + zOffset, 140, -40, 30, 3.5, '#00f2fe', 'rgba(0, 242, 254, 0.3)');
    }
    
    if (toggleElec.checked) {
      const yOffset = window.tcsBimState.elecOffset * -25;
      drawIsoTube(-40, -120, 52, -40, -50 + yOffset, 52, 1.8, '#f39c12', 'rgba(243, 156, 18, 0.2)');
      drawIsoTube(-40, -50 + yOffset, 52, -40, 40 + yOffset, 52, 1.8, '#f39c12', 'rgba(243, 156, 18, 0.2)');
      drawIsoTube(-40, 40 + yOffset, 52, -40, 120, 52, 1.8, '#f39c12', 'rgba(243, 156, 18, 0.2)');
    }
    
    const plumbingActive = window.tcsBimState.state !== 'resolved';
    const electricalActive = window.tcsBimState.state !== 'resolved';
    
    if (toggleHvac.checked && togglePlumb.checked) {
      drawClashNode(-50, -40, 30, 'CLASH-B12A', plumbingActive);
      drawClashNode(50, -40, 30, 'CLASH-B12B', plumbingActive);
    }
    
    if (toggleHvac.checked && toggleElec.checked) {
      drawClashNode(-40, -50, 52, 'CLASH-C04', electricalActive);
    }
    
    requestAnimationFrame(render);
  }
  
  btnRun.addEventListener('click', () => {
    if (window.tcsBimState.state !== 'idle') return;
    window.tcsBimState.state = 'scanning';
    window.tcsBimState.progress = 0;
    scanline.classList.add('scanning');
    clearConsole();
    addConsoleLine('bim_log_1', 'system');
  });
  
  btnReset.addEventListener('click', () => {
    window.tcsBimState.state = 'idle';
    window.tcsBimState.progress = 0;
    window.tcsBimState.pipeOffset = 0;
    window.tcsBimState.elecOffset = 0;
    
    hudStatus.className = 'bim-hud-status-badge clash';
    hudStatus.setAttribute('data-translate', 'bim_status_clash');
    const currentLang = localStorage.getItem('tcs_lang') || 'id';
    if (window.TCS_TRANSLATIONS && window.TCS_TRANSLATIONS['bim_status_clash']) {
      hudStatus.innerText = window.TCS_TRANSLATIONS['bim_status_clash'][currentLang];
    } else {
      hudStatus.innerText = currentLang === 'en' ? '⚠️ 3 Clashes Detected' : '⚠️ 3 Bentrokan Terdeteksi';
    }
    
    btnRun.style.display = 'inline-block';
    btnReset.style.display = 'none';
    scanline.classList.remove('scanning');
    
    clearConsole();
    const lineEl = document.createElement('div');
    lineEl.className = 'console-line system';
    lineEl.innerText = '> [SYS] READY. PRESS RUN TO INITIATE 3D AUDIT.';
    consoleBody.appendChild(lineEl);
  });
  
  togglePlumb.addEventListener('change', () => {
    addConsoleLine(togglePlumb.checked ? 'Plumbing Layer Enabled.' : 'Plumbing Layer Disabled.', 'system');
  });
  toggleHvac.addEventListener('change', () => {
    addConsoleLine(toggleHvac.checked ? 'Duct Layer Enabled.' : 'Duct Layer Disabled.', 'system');
  });
  toggleElec.addEventListener('change', () => {
    addConsoleLine(toggleElec.checked ? 'Electrical Layer Enabled.' : 'Electrical Layer Disabled.', 'system');
  });
  
  window.addEventListener('tcsLanguageChanged', (e) => {
    const lang = e.detail.language || 'id';
    const activeKey = hudStatus.getAttribute('data-translate');
    if (activeKey && window.TCS_TRANSLATIONS && window.TCS_TRANSLATIONS[activeKey]) {
      hudStatus.innerText = window.TCS_TRANSLATIONS[activeKey][lang];
    }
    
    const runKey = btnRun.getAttribute('data-translate');
    if (runKey && window.TCS_TRANSLATIONS && window.TCS_TRANSLATIONS[runKey]) {
      btnRun.innerText = window.TCS_TRANSLATIONS[runKey][lang];
    }
    const resetKey = btnReset.getAttribute('data-translate');
    if (resetKey && window.TCS_TRANSLATIONS && window.TCS_TRANSLATIONS[resetKey]) {
      btnReset.innerText = window.TCS_TRANSLATIONS[resetKey][lang];
    }
    
    document.querySelectorAll('.bim-toggle-text').forEach((el) => {
      const key = el.getAttribute('data-translate');
      if (key && window.TCS_TRANSLATIONS && window.TCS_TRANSLATIONS[key]) {
        el.innerText = window.TCS_TRANSLATIONS[key][lang];
      }
    });
  });
  
  render();
}

/* ==========================================================================
   7. CYBERPUNK SCADA UTILITIES HOVER SIMULATOR ENGINE (FIXED & ENHANCED)
   ========================================================================== */
function initScadaUtilitiesSimulator() {
  const canvas = document.getElementById('scadaCanvas');
  if (!canvas) return;

  const ctx = canvas.getContext('2d');
  const tooltip = document.getElementById('scadaTooltip');
  const sensorVal = document.getElementById('sensorVal');
  const card = document.getElementById('scadaUtilitiesCard');

  let width, height;
  let isHovered = false;
  let mouseX = -1000;
  let mouseY = -1000;
  let particleOffset = 0;

  function resize() {
    const rect = card.getBoundingClientRect();
    if (rect.width === 0 || rect.height === 0) return;
    const dpr = window.devicePixelRatio || 1;
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    ctx.scale(dpr, dpr);
    width = rect.width;
    height = rect.height;
  }
  
  // Panggil resize berkala agar ukuran pas saat tab dibuka
  window.addEventListener('resize', resize);
  setTimeout(resize, 100);
  
  // Deteksi klik tab utilities agar canvas langsung menyesuaikan ukuran
  const utilTabBtn = document.querySelector('[data-tab="utilities"]');
  if (utilTabBtn) {
    utilTabBtn.addEventListener('click', () => {
      setTimeout(resize, 50);
    });
  }

  card.addEventListener('mouseenter', () => { isHovered = true; });
  card.addEventListener('mouseleave', () => {
    isHovered = false;
    if (tooltip) tooltip.style.display = 'none';
  });

  card.addEventListener('mousemove', (e) => {
    const rect = card.getBoundingClientRect();
    mouseX = e.clientX - rect.left;
    mouseY = e.clientY - rect.top;
  });

  // Titik koordinat sensor katup (Valves) di atas gambar Process.jpeg
  const valves = [
    { xRatio: 0.28, yRatio: 0.48, name: "VALVE #01 - STEAM MAIN", bar: "16.2 BAR", temp: "210°C" },
    { xRatio: 0.52, yRatio: 0.52, name: "VALVE #02 - COMPRESSED AIR", bar: "8.5 BAR", temp: "45°C" },
    { xRatio: 0.76, yRatio: 0.48, name: "VALVE #03 - COOLING LOOP", bar: "4.1 BAR", temp: "18°C" }
  ];

  function render() {
    if (!width || !height) {
      resize();
      requestAnimationFrame(render);
      return;
    }

    ctx.clearRect(0, 0, width, height);

    particleOffset += 3.5;
    if (particleOffset > 30) particleOffset = 0;

    // 1. Render Garis Aliran Neon Melintang (Selalu aktif bersinar lembut, makin terang saat hover)
    ctx.save();
    ctx.shadowBlur = isHovered ? 18 : 10;
    ctx.shadowColor = '#00f2fe';
    ctx.strokeStyle = isHovered ? 'rgba(0, 242, 254, 0.95)' : 'rgba(0, 242, 254, 0.5)';
    ctx.lineWidth = isHovered ? 6 : 4;
    ctx.setLineDash([15, 12]);
    ctx.lineDashOffset = -particleOffset;

    ctx.beginPath();
    ctx.moveTo(40, height * 0.5);
    ctx.lineTo(width - 40, height * 0.5);
    ctx.stroke();
    ctx.restore();

    // 2. Render Titik Sensor Katup (Valves)
    let activeValve = null;
    valves.forEach((v, idx) => {
      const vx = width * v.xRatio;
      const vy = height * v.yRatio;

      // Lingkaran luar radar katup
      ctx.fillStyle = 'rgba(3, 7, 18, 0.85)';
      ctx.strokeStyle = isHovered ? '#00f2fe' : '#f59e0b';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(vx, vy, 15, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // Inti lampu katup berdenyut
      ctx.fillStyle = idx % 2 === 0 ? '#00f2fe' : '#f59e0b';
      ctx.beginPath();
      ctx.arc(vx, vy, 6, 0, Math.PI * 2);
      ctx.fill();

      // Cek jarak kursor ke katup untuk menampilkan pop-up data tekanan
      const dist = Math.hypot(mouseX - vx, mouseY - vy);
      if (isHovered && dist < 50) {
        activeValve = { x: vx, y: vy, ...v };
      }
    });

    // 3. Tampilkan Pop-up Sensor Real-time jika kursor mendekati katup
    if (activeValve && tooltip) {
      tooltip.style.left = `${activeValve.x}px`;
      tooltip.style.top = `${activeValve.y - 15}px`;
      tooltip.style.display = 'block';
      sensorVal.innerText = `${activeValve.bar} | ${activeValve.temp}`;
      const titleEl = tooltip.querySelector('.sensor-title');
      if (titleEl) titleEl.innerText = activeValve.name;
    } else if (tooltip) {
      tooltip.style.display = 'none';
    }

    requestAnimationFrame(render);
  }

  render();
}

    let href = a.getAttribute('href') || '';

/* ==========================================================================
   9. SECURE GEMINI AI CHATBOT SYSTEM
   ========================================================================== */
function initTcsChatbot() {
  const trigger = document.getElementById('tcsChatTrigger');
  const container = document.getElementById('tcsChatContainer');
  const closeBtn = document.getElementById('tcsChatClose');
  const inputField = document.getElementById('tcsChatInput');
  const sendBtn = document.getElementById('tcsChatSend');
  const messagesArea = document.getElementById('tcsChatMessages');
  
  if (!trigger || !container || !closeBtn || !inputField || !sendBtn || !messagesArea) return;
  
  let chatOpen = false;
  let isAiResponding = false;
  
  trigger.addEventListener('click', () => {
    chatOpen = !chatOpen;
    if (chatOpen) {
      container.classList.add('open');
      container.setAttribute('aria-hidden', 'false');
      inputField.focus();
      const dot = trigger.querySelector('.chat-trigger-dot');
      if (dot) dot.style.display = 'none';
    } else {
      container.classList.remove('open');
      container.setAttribute('aria-hidden', 'true');
    }
  });
  
  closeBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    chatOpen = false;
    container.classList.remove('open');
    container.setAttribute('aria-hidden', 'true');
  });
  
  document.addEventListener('click', (e) => {
    if (chatOpen && !container.contains(e.target) && !trigger.contains(e.target)) {
      chatOpen = false;
      container.classList.remove('open');
    }
  });
  
  inputField.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      sendChatMessage();
    } else if (e.key === 'Escape' || e.key === 'Esc') {
      chatOpen = false;
      container.classList.remove('open');
      container.setAttribute('aria-hidden', 'true');
      trigger.focus();
    }
  });
  
  sendBtn.addEventListener('click', sendChatMessage);
  
  function sendChatMessage() {
    const text = inputField.value.trim();
    if (!text || isAiResponding) return;
    
    isAiResponding = true;
    inputField.value = '';
    
    appendChatBubble(text, true);
    const loaderId = appendChatLoader();
    
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler((response) => handleChatSuccess(response, loaderId))
        .withFailureHandler((error) => handleChatFailure(error, loaderId))
        .callGeminiSecure(text);
    } else if (window.TCS_GAS_WEB_APP_URL) {
      attemptFetch(window.TCS_GAS_WEB_APP_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify({ action: "callGeminiSecure", data: { query: text } })
      })
      .then(res => res.json())
      .then(response => handleChatSuccess(response, loaderId))
      .catch(error => handleChatFailure(error, loaderId));
    } else {
      setTimeout(() => {
        const dummyResponses = [
          "Berdasarkan **Opsi A (Kemitraan Lahan)**, Anda bisa bermitra dengan modal mesin Rp0. Bagi hasil bersih adalah **35% Host** dan **65% PT TCS**.",
          "Untuk **Opsi B (Finansial Mandiri)**, modal awal mulai dari **Rp100 Juta**.",
          "Legalitas dan izin operasional SPKLU sepenuhnya didampingi oleh **PT TCS**."
        ];
        handleChatSuccess({ success: true, text: dummyResponses[0] }, loaderId);
      }, 1500);
    }
  }
  
  function handleChatSuccess(response, loaderId) {
    removeChatLoader(loaderId);
    isAiResponding = false;
    if (response.success && response.text) {
      appendChatBubble(response.text, false);
    } else {
      appendSystemError(response.error || response.message || "Gagal mendapatkan respon AI.");
    }
  }
  
  function handleChatFailure(error, loaderId) {
    removeChatLoader(loaderId);
    isAiResponding = false;
    appendSystemError("Terjadi kendala jaringan: " + (error.message || error));
  }

  function appendChatBubble(messageText, isUser = false) {
    const bubble = document.createElement('div');
    bubble.className = isUser ? 'tcs-chat-bubble user' : 'tcs-chat-bubble bot';
    bubble.textContent = messageText;
    messagesArea.appendChild(bubble);
    messagesArea.scrollTop = messagesArea.scrollHeight;
  }
  
  function appendSystemError(errorText) {
    const errorBubble = document.createElement('div');
    errorBubble.className = 'tcs-chat-bubble system-error';
    errorBubble.innerText = errorText;
    messagesArea.appendChild(errorBubble);
    messagesArea.scrollTop = messagesArea.scrollHeight;
  }
  
  function appendChatLoader() {
    const loaderId = 'loader_' + Date.now();
    const wrapper = document.createElement('div');
    wrapper.id = loaderId;
    wrapper.className = 'tcs-chat-bubble bot';
    wrapper.innerHTML = `<div class="tcs-typing-indicator"><span class="tcs-typing-dot"></span><span class="tcs-typing-dot"></span><span class="tcs-typing-dot"></span></div>`;
    messagesArea.appendChild(wrapper);
    messagesArea.scrollTop = messagesArea.scrollHeight;
    return loaderId;
  }
  
  function removeChatLoader(loaderId) {
    const loader = document.getElementById(loaderId);
    if (loader) loader.remove();
  }
}

/* ==========================================================================
   10. OUT-OF-BOUNDS 3D PARALLAX INTERACTION (DESKTOP & MOBILE TOUCH)
   ========================================================================== */
function init3DParallaxCard() {
  const card = document.getElementById('plumbing3dCard');
  if (!card) return;

  const bgLayer = card.querySelector('.oob-bg-layer');
  const cutoutLayer = card.querySelector('.oob-cutout-layer');

  card.addEventListener('mousemove', (e) => {
    const rect = card.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    
    const centerX = rect.width / 2;
    const centerY = rect.height / 2;
    const rotateX = ((y - centerY) / centerY) * -12;
    const rotateY = ((x - centerX) / centerX) * 12;

    card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
    
    if (bgLayer) bgLayer.style.transform = `translateX(${rotateY * -0.6}px) translateY(${rotateX * 0.6}px)`;
    if (cutoutLayer) cutoutLayer.style.transform = `translateZ(55px) translateX(${rotateY * 1.2}px) translateY(${rotateX * -1.2}px)`;
  });

  card.addEventListener('mouseleave', () => {
    card.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg)';
    if (bgLayer) bgLayer.style.transform = 'translateX(0) translateY(0)';
    if (cutoutLayer) cutoutLayer.style.transform = 'translateZ(45px) translateX(0) translateY(0)';
  });

  card.addEventListener('touchmove', (e) => {
    if (!e.touches[0]) return;
    const rect = card.getBoundingClientRect();
    const x = e.touches[0].clientX - rect.left;
    const y = e.touches[0].clientY - rect.top;
    
    const centerX = rect.width / 2;
    const centerY = rect.height / 2;
    const rotateX = ((y - centerY) / centerY) * -8;
    const rotateY = ((x - centerX) / centerX) * 8;

    card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
    if (bgLayer) bgLayer.style.transform = `translateX(${rotateY * -0.4}px) translateY(${rotateX * 0.4}px)`;
    if (cutoutLayer) cutoutLayer.style.transform = `translateZ(50px) translateX(${rotateY * 0.8}px) translateY(${rotateX * -0.8}px)`;
  }, { passive: true });

  card.addEventListener('touchend', () => {
    card.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg)';
    if (bgLayer) bgLayer.style.transform = 'translateX(0) translateY(0)';
    if (cutoutLayer) cutoutLayer.style.transform = 'translateZ(45px) translateX(0) translateY(0)';
  });
}

  'turbine-01': { title: 'TURBINE-A GENERATOR', pressure: '18.1', temp: '245.0', flow: '520.8' }
};

function drawScadaPipes() {
  if (!scadaCtx) return;
  scadaCtx.clearRect(0, 0, scadaCanvas.width, scadaCanvas.height);

  // Pipa Utama
  scadaCtx.lineWidth = 6;
  scadaCtx.strokeStyle = '#1e293b';
  scadaCtx.beginPath();
  scadaCtx.moveTo(80, 130);
  scadaCtx.lineTo(380, 130);
  scadaCtx.lineTo(380, 280);
  scadaCtx.lineTo(820, 280);
  scadaCtx.stroke();

  // Aliran Fluida Menyala (jika valve terbuka)
  if (valveOpenState) {
    scadaCtx.lineWidth = 3;
    scadaCtx.strokeStyle = '#00f2fe';
    scadaCtx.setLineDash([12, 16]);
    scadaCtx.lineDashOffset = -scadaOffset;
    scadaCtx.beginPath();
    scadaCtx.moveTo(80, 130);
    scadaCtx.lineTo(380, 130);
    scadaCtx.lineTo(380, 280);
    scadaCtx.lineTo(820, 280);
    scadaCtx.stroke();
    scadaCtx.setLineDash([]);
  }
}

function loopScada() {
  scadaOffset += 1.2;
  if (scadaOffset > 50) scadaOffset = 0;
  drawScadaPipes();
  requestAnimationFrame(loopScada);
}

function toggleScadaValve(id) {
  valveOpenState = !valveOpenState;
  const btn = document.getElementById('valveBtn01');
  if (valveOpenState) {
    btn.className = 'valve-btn open';
    btn.textContent = 'V-01: OPEN';
  } else {
    btn.className = 'valve-btn';
    btn.textContent = 'V-01: CLOSED';
  }
}

function showScadaTelemetry(key, e) {

  document.getElementById('telFlow').textContent = valveOpenState ? d.flow : '0.0';
  document.getElementById('scadaTelemetryPanel').classList.remove('hidden');
}

function hideScadaTelemetry() {
  document.getElementById('scadaTelemetryPanel').classList.add('hidden');
}

// 3. CARBON & ENERGY SAVINGS CALCULATOR
function calculateSavings() {
  const kva = parseFloat(document.getElementById('inputKva').value);
  const hours = parseFloat(document.getElementById('inputHours').value);
  
  document.getElementById('valKva').textContent = kva;
  document.getElementById('valHours').textContent = hours;

  // Rumus Estimasi Penghematan & Karbon
  const monthlySavings = kva * hours * 30 * 145; // Asumsi efisiensi dan tarif industri
  const annualCarbon = (kva * hours * 365 * 0.85) / 1000; // Ton CO2

  document.getElementById('resRupiah').textContent = 'Rp ' + monthlySavings.toLocaleString('id-ID');
  document.getElementById('resCarbon').textContent = annualCarbon.toFixed(1) + ' Ton';
}


// 4. BIM & MEP CLASH DETECTION SIMULATOR V2
const clashCanvas = document.getElementById('clashCanvas');
const clashCtx = clashCanvas ? clashCanvas.getContext('2d') : null;

function drawClashScene(statusText, hasClash) {
  if (!clashCtx) return;
  clashCtx.clearRect(0, 0, clashCanvas.width, clashCanvas.height);

  // Jalur Pipa Hidran (Biru)
  clashCtx.lineWidth = 14;
  clashCtx.strokeStyle = '#00f2fe';
  clashCtx.beginPath();
  clashCtx.moveTo(50, 150);
  clashCtx.lineTo(850, 150);
  clashCtx.stroke();

  // Jalur Tray Kabel (Kuning / Oranye)
  clashCtx.lineWidth = 12;
  clashCtx.strokeStyle = '#f59e0b';
  clashCtx.beginPath();
  clashCtx.moveTo(450, 40);
  clashCtx.lineTo(450, 260);
  clashCtx.stroke();

  // Titik Koordinat Bentrokan (Clash Point di tengah X:450, Y:150)
  if (hasClash) {
    clashCtx.fillStyle = '#ef4444';
    clashCtx.beginPath();
    clashCtx.arc(450, 150, 22, 0, Math.PI * 2);
    clashCtx.fill();
    clashCtx.lineWidth = 3;
    clashCtx.strokeStyle = '#ffffff';
    clashCtx.stroke();

    clashCtx.fillStyle = '#ffffff';
    clashCtx.font = 'bold 11px Courier New';
    clashCtx.fillText('CLASH #01', 420, 190);
  }

  document.getElementById('clashStatus').textContent = statusText;
  document.getElementById('clashStatus').style.color = hasClash ? '#ef4444' : '#00e575';
}

function runClashSimulation() {
  drawClashScene('MEMINDAI SPASIAL BIM NODES...', false);
  setTimeout(() => {
    drawClashScene('PERINGATAN: TERDETEKSI 1 BENTROKAN (Pipa vs Tray Kabel di Zona A-2)!', true);
  }, 1000);
}

if (clashCanvas) drawClashScene('STATUS: SIAP MEMINDAI NODES', false);

/* CYBER-INDUSTRIAL SCADA HMI ENGINE (AUTO-INIT)                     */
/* ================================================================= */
(function() {
  function initScadaHmi() {
    const canvas = document.getElementById('scadaControlCanvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    let offset = 0;
    let valveOpen = true;

    const mockData = {
      'pump-01': { title: 'P-01: BOILER FEED PUMP', pressure: '42.5', temp: '118.4', flow: '310.2' },
      'turbine-01': { title: 'TURBINE-A GENERATOR', pressure: '18.1', temp: '245.0', flow: '520.8' }
    };

    function drawPipes() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Jalur Pipa Dasar
      ctx.lineWidth = 6;
      ctx.strokeStyle = '#1e293b';
      ctx.beginPath();
      ctx.moveTo(70, 120);
      ctx.lineTo(370, 120);
      ctx.lineTo(370, 270);
      ctx.lineTo(840, 270);
      ctx.stroke();

      // Animasi Aliran Fluida / Uap Menyala (Cyan Neon)
      if (valveOpen) {
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#00f2fe';
        ctx.setLineDash([12, 16]);
        ctx.lineDashOffset = -offset;
        ctx.beginPath();
        ctx.moveTo(70, 120);
        ctx.lineTo(370, 120);
        ctx.lineTo(370, 270);
        ctx.lineTo(840, 270);
        ctx.stroke();
        ctx.setLineDash([]);
      }
    }

    function animateLoop() {
      offset += 1.5;
      if (offset > 50) offset = 0;
      drawPipes();
      requestAnimationFrame(animateLoop);
    }

    animateLoop();

    // Global Functions untuk interaksi tombol & hover
    window.toggleScadaControlValve = function(id) {
      valveOpen = !valveOpen;
      const btn = document.getElementById('scadaValveBtn01');
      if (!btn) return;
      if (valveOpen) {
        btn.textContent = 'V-01: OPEN';
        btn.style.background = '#00e575';
        btn.style.boxShadow = '0 0 8px #00e575';
        btn.style.color = '#030712';
      } else {
        btn.textContent = 'V-01: CLOSED';
        btn.style.background = '#ef4444';
        btn.style.boxShadow = '0 0 8px #ef4444';
        btn.style.color = '#ffffff';
      }
    };

    window.showScadaControlTelemetry = function(key, e) {
      const d = mockData[key];
      const popup = document.getElementById('scadaTelemetryPopup');
      if (!d || !popup) return;
      document.getElementById('scadaTelTitle').textContent = d.title;
      document.getElementById('scadaTelPressure').textContent = valveOpen ? d.pressure : '0.0';
      document.getElementById('scadaTelTemp').textContent = valveOpen ? d.temp : '25.0';
      document.getElementById('scadaTelFlow').textContent = valveOpen ? d.flow : '0.0';
      popup.classList.remove('hidden');
    };

    window.hideScadaControlTelemetry = function() {
      const popup = document.getElementById('scadaTelemetryPopup');
      if (popup) popup.classList.add('hidden');
    };
  }

  // Jalankan saat DOM siap
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initScadaHmi);
  } else {
    initScadaHmi();
  }
})();

/* MASTERPIECE SCADA PARTICLE FLOW ENGINE (ACTIVE OVERRIDE)          */
/* ================================================================= */
(function() {
  function initMasterpieceScada() {
    const canvas = document.getElementById('scadaCanvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');

    const pipePath = [
      {x: 40, y: 175},
      {x: 230, y: 175},
      {x: 230, y: 235},
      {x: 460, y: 235}
    ];

    let particles = [];
    const particleCount = 35;

    for (let i = 0; i < particleCount; i++) {
      particles.push({
        progress: Math.random() * getPathLength(pipePath),
        speed: 1.8 + Math.random() * 1.2,
        size: 2 + Math.random() * 1.8
      });
    }

    function getPathLength(path) {
      let len = 0;
      for (let i = 0; i < path.length - 1; i++) {
        let dx = path[i+1].x - path[i].x;
        let dy = path[i+1].y - path[i].y;
        len += Math.sqrt(dx*dx + dy*dy);
      }
      return len;
    }

    function getPointAtDistance(path, distance) {
      let currentDist = 0;
      for (let i = 0; i < path.length - 1; i++) {
        let p1 = path[i];
        let p2 = path[i+1];
        let dx = p2.x - p1.x;
        let dy = p2.y - p1.y;
        let segLen = Math.sqrt(dx*dx + dy*dy);

        if (currentDist + segLen >= distance) {
          let t = (distance - currentDist) / segLen;
          return { x: p1.x + t * dx, y: p1.y + t * dy };
        }
        currentDist += segLen;
      }
      return path[path.length - 1];
    }

    const totalLen = getPathLength(pipePath);

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.lineWidth = 7;
      ctx.strokeStyle = '#030712';
      ctx.beginPath();
      ctx.moveTo(pipePath[0].x, pipePath[0].y);
      for (let i = 1; i < pipePath.length; i++) ctx.lineTo(pipePath[i].x, pipePath[i].y);
      ctx.stroke();

      ctx.lineWidth = 3;
      ctx.strokeStyle = 'rgba(0, 242, 254, 0.45)';
      ctx.beginPath();
      ctx.moveTo(pipePath[0].x, pipePath[0].y);
      for (let i = 1; i < pipePath.length; i++) ctx.lineTo(pipePath[i].x, pipePath[i].y);
      ctx.stroke();

      particles.forEach(p => {
        p.progress += p.speed;
        if (p.progress > totalLen) p.progress = 0;

        let pos = getPointAtDistance(pipePath, p.progress);

        ctx.shadowBlur = 12;
        ctx.shadowColor = '#00f2fe';
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(pos.x, pos.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
      });

      ctx.fillStyle = '#f59e0b';
      ctx.beginPath();
      ctx.arc(230, 175, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      requestAnimationFrame(render);
    }

    render();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initMasterpieceScada);
  } else {
    initMasterpieceScada();
  }
})();
