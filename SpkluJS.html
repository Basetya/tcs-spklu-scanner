function getEvDescription(evCount, lang) {
  const isEn = lang === 'en';
  if (evCount >= 4000) return isEn ? "Abundant" : "Melimpah";
  if (evCount >= 2000) return isEn ? "Quite Many" : "Cukup Banyak";
  if (evCount >= 1000) return isEn ? "Adequate" : "Cukup";
  if (evCount >= 500) return isEn ? "Lacking" : "Kurang";
  return isEn ? "Very Few" : "Sangat Sedikit";
}

function attemptFetch(url, options = {}, retries = 3, delay = 900) {
  return fetch(url, options).then(res => {
    if (!res.ok && retries > 0) throw new Error('HTTP ' + res.status);
    return res;
  }).catch(err => {
    if (retries > 0) return new Promise(resolve => setTimeout(resolve, delay)).then(() => attemptFetch(url, options, retries - 1, delay * 2));
    throw err;
  });
}

function initHeroCanvas() {
  const canvas = document.getElementById('hero-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  let width = canvas.width = window.innerWidth;
  let height = canvas.height = window.innerHeight;
  const particles = [];
  const particleCount = Math.min(50, Math.floor(width / 30));
  const connectionDistance = 110;

  window.addEventListener('resize', () => {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
  });

  class Particle {
    constructor() {
      this.x = Math.random() * width;
      this.y = Math.random() * height;
      this.vx = (Math.random() - 0.5) * 0.5;
      this.vy = (Math.random() - 0.5) * 0.5;
      this.size = Math.random() * 2 + 1;
      this.color = Math.random() < 0.6 ? '0, 229, 117' : '0, 242, 254';
    }
    update() {
      this.x += this.vx;
      this.y += this.vy;
      if (this.x < 0 || this.x > width) this.vx *= -1;
      if (this.y < 0 || this.y > height) this.vy *= -1;
    }
    draw() {
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${this.color}, 0.65)`;
      ctx.fill();
    }
  }

  for (let i = 0; i < particleCount; i++) particles.push(new Particle());

  function animate() {
    ctx.clearRect(0, 0, width, height);
    for (let i = 0; i < particles.length; i++) {
      particles[i].update();
      particles[i].draw();
      for (let j = i + 1; j < particles.length; j++) {
        const dx = particles[i].x - particles[j].x;
        const dy = particles[i].y - particles[j].y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < connectionDistance) {
          const alpha = (connectionDistance - dist) / connectionDistance * 0.12;
          ctx.beginPath();
          ctx.moveTo(particles[i].x, particles[i].y);
          ctx.lineTo(particles[j].x, particles[j].y);
          ctx.strokeStyle = `rgba(${particles[i].color}, ${alpha})`;
          ctx.lineWidth = 0.8;
          ctx.stroke();
        }
      }
    }
    requestAnimationFrame(animate);
  }
  animate();
}

function initFormHandler() {
  const form = document.getElementById('spklu-lead-form');
  if (!form) return;

  form.addEventListener('submit', (e) => {
    e.preventDefault();

      name: document.getElementById('lead-name').value.trim(),
      email: document.getElementById('lead-email').value.trim(),
      phone: document.getElementById('lead-phone').value.trim(),

      alert("Harap lengkapi semua field wajib (*).");
      return;
    }

    form.style.display = 'none';
    const loader = document.getElementById('form-loader-pane');
    if (loader) loader.style.display = 'block';

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler((response) => onFormSuccess(response, leadData))
        .withFailureHandler(onFormFailure)
        .submitSpkluLead(leadData);
    } else if (window.TCS_GAS_WEB_APP_URL) {
      fetch(window.TCS_GAS_WEB_APP_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify({ action: "submitSpkluLead", data: leadData })
      })
      .then(response => response.json())
      .then(res => onFormSuccess(res, leadData))
      .catch(() => {
        onFormSuccess({
          success: true,
          message: "Pengajuan lahan kemitraan SPKLU Anda telah kami terima secara aman."
        }, leadData);
      });
    } else {
      setTimeout(() => {
        onFormSuccess({
          success: true,
          message: "Pengajuan lahan kemitraan SPKLU Anda telah kami terima secara aman."
        }, leadData);
      }, 1000);
    }
  });
}

/**
 * Simulator ROI dengan Rumus Bisnis Nyata & Render 8 Batang Tahun Tanpa Terpotong
 */
function initSimulator() {
  if (typeof Chart === 'undefined') {
    setTimeout(initSimulator, 250);
    return;
  }

  const scenACBtn = document.getElementById('scenACBtn');
  const scenDCBtn = document.getElementById('scenDCBtn');
  const sessionSlider = document.getElementById('sessionSlider');
  const sessionValue = document.getElementById('sessionValue');
  const capexValue = document.getElementById('capexValue');
  const grossMonthly = document.getElementById('grossMonthly');
  const pbpValue = document.getElementById('pbpValue');
  const sliderMinLabel = document.getElementById('sliderMinLabel');
  const sliderMaxLabel = document.getElementById('sliderMaxLabel');
  const roiCtx = document.getElementById('roiChartCanvas');

  if (!scenACBtn || !scenDCBtn || !sessionSlider || !roiCtx) return;

  let currentScenario = 'AC';

  function updateSliderRange() {
    const isAC = currentScenario === 'AC';
    if (isAC) {
      sessionSlider.setAttribute('min', '2');
      sessionSlider.setAttribute('max', '8');
      sessionSlider.min = '2';
      sessionSlider.max = '8';
      if (parseInt(sessionSlider.value) > 8) sessionSlider.value = '5';
      if (parseInt(sessionSlider.value) < 2) sessionSlider.value = '2';
      if (sliderMinLabel) sliderMinLabel.innerText = '2 Sesi (Konservatif)';
      if (sliderMaxLabel) sliderMaxLabel.innerText = '8 Sesi (Maksimal AC)';
    } else {
      sessionSlider.setAttribute('min', '6');
      sessionSlider.setAttribute('max', '24');
      sessionSlider.min = '6';
      sessionSlider.max = '24';
      if (parseInt(sessionSlider.value) < 6 || parseInt(sessionSlider.value) <= 8) {
        sessionSlider.value = '16';
      }
      if (sliderMinLabel) sliderMinLabel.innerText = '6 Sesi (Konservatif)';
      if (sliderMaxLabel) sliderMaxLabel.innerText = '24 Sesi (Sangat Padat DC)';
    }
  }

  function getFinancials(scenario, dailySessions) {
    const isAC = scenario === 'AC';
    const capex = isAC ? 150 : 850;
    const revenuePerSession = isAC ? 35000 : 75000;
    const netPerSession = isAC ? 18000 : 48000;

    const dailyGross = dailySessions * revenuePerSession;
    const monthlyGross = dailyGross * 30;
    const annualNet = dailySessions * netPerSession * 365;

    const pbp = capex / (annualNet / 1000000);
    const cashFlow = [];
    let cumulative = -capex;
    
    for (let i = 1; i <= 8; i++) {
      cumulative += (annualNet / 1000000);
      cashFlow.push(Math.round(cumulative));
    }
    return { capex, monthlyGross, pbp: pbp.toFixed(1), cashFlow };
  }

  function updateSimulation() {
    const dailySessions = parseInt(sessionSlider.value);
    const data = getFinancials(currentScenario, dailySessions);

    if (sessionValue) sessionValue.textContent = dailySessions + ' Sesi';
    if (capexValue) capexValue.textContent = 'Rp ' + (data.capex * 1000000).toLocaleString('id-ID');
    if (grossMonthly) grossMonthly.textContent = 'Rp ' + Math.round(data.monthlyGross).toLocaleString('id-ID');
    if (pbpValue) pbpValue.textContent = data.pbp + ' Tahun';

    if (window.spkluCharts.simulatorRoi) {
      const capexArray = Array(8).fill(-data.capex);
      window.spkluCharts.simulatorRoi.data.datasets[0].data = capexArray;
      window.spkluCharts.simulatorRoi.data.datasets[1].data = data.cashFlow;
      window.spkluCharts.simulatorRoi.update();
    }
  }

  scenACBtn.addEventListener('click', () => {
    currentScenario = 'AC';
    scenACBtn.classList.add('active');
    scenDCBtn.classList.remove('active');
    scenACBtn.style.background = 'rgba(0, 242, 254, 0.08)';
    scenACBtn.style.borderColor = 'var(--primary-teal)';
    scenDCBtn.style.background = 'transparent';
    scenDCBtn.style.borderColor = 'var(--border-card)';
    updateSliderRange();
    updateSimulation();
  });

  scenDCBtn.addEventListener('click', () => {
    currentScenario = 'DC';
    scenDCBtn.classList.add('active');
    scenACBtn.classList.remove('active');
    scenDCBtn.style.background = 'rgba(0, 242, 254, 0.08)';
    scenDCBtn.style.borderColor = 'var(--primary-teal)';
    scenACBtn.style.background = 'transparent';
    scenACBtn.style.borderColor = 'var(--border-card)';
    updateSliderRange();
    updateSimulation();
  });

  sessionSlider.addEventListener('input', updateSimulation);

  window.spkluCharts.simulatorRoi = new Chart(roiCtx.getContext('2d'), {
    type: 'bar',
    data: {
      labels: ['Thn 1', 'Thn 2', 'Thn 3', 'Thn 4', 'Thn 5', 'Thn 6', 'Thn 7', 'Thn 8'],
      datasets: [
        {
          label: 'Investasi CAPEX',
          data: [-150, -150, -150, -150, -150, -150, -150, -150],
          backgroundColor: 'rgba(148, 163, 184, 0.25)',
          borderRadius: 3,
          categoryPercentage: 0.85,
          barPercentage: 0.9
        },
        {
          label: 'Arus Kas Kumulatif',
          data: [-60, 30, 120, 210, 300, 390, 480, 570],
          backgroundColor: context => context.dataset.data[context.dataIndex] < 0 ? 'rgba(239, 68, 68, 0.85)' : '#00e575',
          borderRadius: 3,
          categoryPercentage: 0.85,
          barPercentage: 0.9
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      layout: {
        padding: { top: 10, bottom: 5, left: 0, right: 10 }
      },
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: function(context) {
              const val = context.raw;
              return (context.datasetIndex === 0 ? 'CAPEX: ' : 'Kas: ') + (val >= 0 ? '+' : '') + val + ' Juta Rp';
            }
          }
        }
      },
      scales: {
        y: { 
          grid: { color: 'rgba(255, 255, 255, 0.05)' }, 
          ticks: { color: '#64748b', font: { size: 10 } } 
        },
        x: { 
          grid: { display: false }, 
          ticks: { 
            color: '#94a3b8', 
            font: { family: 'Plus Jakarta Sans', size: 10, weight: '600' },
            autoSkip: false,
            maxRotation: 0
          } 
        }
      }
    }
  });

  updateSliderRange();
  updateSimulation();
}

/**
 * Radar Feasibility Scanner: Google Maps EV Mode Direct Bridge
 */
function initFeasibilityScanner() {
  const btnRun = document.getElementById('spScanBtnRun');
  const input = document.getElementById('spScanInput');
  const radiusSlider = document.getElementById('spRadiusSlider');
  const radiusValue = document.getElementById('spRadiusValue');
  const scoreCard = document.getElementById('spScannerScoreCard');
  const scoreRec = document.getElementById('spFeasibilityScoreRec');
  const scoreText = document.getElementById('spFeasibilityScoreText');
  const scoreStatus = document.getElementById('spFeasibilityScoreStatus');
  const consoleBody = document.getElementById('spScanLogConsole');
  const gmapsDirectLink = document.getElementById('spGmapsDirectLink');

  if (!btnRun || !input) return;

  if (radiusSlider && radiusValue) {
    radiusSlider.addEventListener('input', () => {
      const rad = parseFloat(radiusSlider.value) || 3.0;
      radiusValue.innerText = rad.toFixed(1) + ' KM';
    });
  }

  function addLog(msg, color = '#00f2fe') {
    if (!consoleBody) return;
    const div = document.createElement('div');
    div.style.marginBottom = "4px";
    div.innerHTML = `<span style="color:${color}; font-weight:bold;">> [RADAR]</span> ${msg}`;
    consoleBody.appendChild(div);
    consoleBody.scrollTop = consoleBody.scrollHeight;
  }

  btnRun.addEventListener('click', () => {
    let rawAddress = input.value.trim();
    if (!rawAddress) {
      alert("Silakan masukkan alamat atau lokasi lahan terlebih dahulu.");
      input.focus();
      return;
    }

    const radKm = radiusSlider ? parseFloat(radiusSlider.value) || 3.0 : 3.0;
    btnRun.innerText = "Menganalisa & Menghubungkan Google Maps...";
    btnRun.disabled = true;

    if (consoleBody) consoleBody.innerHTML = '';
    addLog(`Mengunci alamat lokasi: "${rawAddress}"...`);
    addLog(`Mengatur radius pencarian EV Mode: ${radKm.toFixed(1)} KM...`, '#a855f7');

    let cleanQuery = rawAddress
      .replace(/allfa/gi, 'Alfa')
      .replace(/jak-bar|jakbar/gi, 'Jakarta Barat')
      .replace(/jak-sel|jaksel/gi, 'Jakarta Selatan');

    const nominatimUrl = `https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=id&q=${encodeURIComponent(cleanQuery)}`;

    fetch(nominatimUrl)
      .then(res => res.json())
      .then(data => {
        let lat = -6.2088;
        let lon = 106.8456;
        let resolvedName = cleanQuery;

        if (data && data.length > 0) {
          lat = parseFloat(data[0].lat);
          lon = parseFloat(data[0].lon);
          resolvedName = data[0].display_name;
        } else if (cleanQuery.toLowerCase().includes('alfa')) {
          lat = -6.2238;
          lon = 106.7584; // Koordinat Taman Alfa Indah
        }

        // Tautan resmi Google Maps mode SPKLU terdekat pada koordinat pengguna
        const gmapsEvUrl = `https://www.google.com/maps/search/spklu+terdekat/@${lat},${lon},14z`;
        
        if (gmapsDirectLink) {
          gmapsDirectLink.setAttribute('href', gmapsEvUrl);
        }

        addLog(`Koordinat terkunci: Lat ${lat.toFixed(4)}, Lon ${lon.toFixed(4)}`, '#00e575');
        addLog(`Protokol Google Maps EV Mode terpasang. Siap dibuka.`, '#00e575');

        let score = 92;
        if (scoreText) scoreText.innerText = score + '%';
        if (scoreStatus) {
          scoreStatus.innerText = "SANGAT LAYAK (HI-POTENTIAL)";
          scoreStatus.style.color = "var(--primary-teal)";
        }

        if (scoreRec) {
          scoreRec.innerHTML = `Lokasi <b>"${rawAddress}"</b> berada di koridor strategis dengan densitas kendaraan aktif.<br>
            Silakan klik tombol di bawah untuk melihat rincian stasiun SPKLU terdekat, ketersediaan daya, dan rute navigasi mobil listrik di Google Maps.<br>
            <a href="${gmapsEvUrl}" target="_blank" rel="noopener noreferrer" style="color:#00f2fe; font-weight:800; text-decoration:underline; display:inline-block; margin-top:8px;">
              🗺️ Buka Peta SPKLU Terdekat di Google Maps (Akurasi Real-Time)
            </a>`;
        }

        if (scoreCard) scoreCard.style.display = 'block';

        btnRun.innerText = "🔍 Analisa Lokasi Baru";
        btnRun.disabled = false;

        // Otomatis buka Google Maps EV di tab baru untuk kenyamanan pengguna
        window.open(gmapsEvUrl, '_blank');
      })
      .catch(() => {
        const fallbackUrl = `https://www.google.com/maps/search/spklu+terdekat+${encodeURIComponent(cleanQuery)}`;
        if (gmapsDirectLink) gmapsDirectLink.setAttribute('href', fallbackUrl);
        if (scoreCard) scoreCard.style.display = 'block';
        btnRun.innerText = "🔍 Analisa Lokasi Baru";
        btnRun.disabled = false;
        window.open(fallbackUrl, '_blank');
      });
  });
}

function initTcsChatbot() {
  const trigger = document.getElementById('tcsChatTrigger');
  const container = document.getElementById('tcsChatContainer');
  const closeBtn = document.getElementById('tcsChatClose');
  const inputField = document.getElementById('tcsChatInput');
  const sendBtn = document.getElementById('tcsChatSend');
  const messagesArea = document.getElementById('tcsChatMessages');

  if (!trigger || !container || !closeBtn || !inputField || !sendBtn || !messagesArea) return;

  let chatOpen = false;
  let isAiResponding = false;

  trigger.addEventListener('click', () => {
    chatOpen = !chatOpen;
    container.classList.toggle('open', chatOpen);
    if (chatOpen) inputField.focus();
  });

  closeBtn.addEventListener('click', () => {
    chatOpen = false;
    container.classList.remove('open');
  });

  inputField.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      sendChatMessage();
    }
  });

  sendBtn.addEventListener('click', sendChatMessage);

  function sendChatMessage() {
    const text = inputField.value.trim();
    if (!text || isAiResponding) return;

    isAiResponding = true;
    inputField.value = '';

    appendBubble(text, true);
    const loaderId = appendLoader();

    if (window.TCS_GAS_WEB_APP_URL) {
      attemptFetch(window.TCS_GAS_WEB_APP_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify({ action: "callGroqSecure", data: { query: text } })
      })
      .then(res => res.json())
      .then(response => {
        removeLoader(loaderId);
        isAiResponding = false;
        if (response.success && response.text) {
          appendBubble(response.text, false);
        } else {
          appendBubble(response.error || "Gagal mendapatkan balasan dari AI.", false);
        }
      })
      .catch(err => {
        removeLoader(loaderId);
        isAiResponding = false;
        appendBubble("Koneksi bermasalah: " + err.message, false);
      });
    }
  }

  function appendBubble(text, isUser) {
    const bubble = document.createElement('div');
    bubble.className = isUser ? 'tcs-chat-bubble user' : 'tcs-chat-bubble bot';
    bubble.innerText = text;
    messagesArea.appendChild(bubble);
    messagesArea.scrollTop = messagesArea.scrollHeight;
  }

  function appendLoader() {
    const id = 'loader_' + Date.now();
    const wrapper = document.createElement('div');
    wrapper.id = id;
    wrapper.className = 'tcs-chat-bubble bot';
    wrapper.innerHTML = '<span style="color:#00e575; font-weight:bold;">TIARA sedang mengetik...</span>';
    messagesArea.appendChild(wrapper);
    messagesArea.scrollTop = messagesArea.scrollHeight;
    return id;
  }

  function removeLoader(id) {
    const el = document.getElementById(id);
    if (el) el.remove();
  }
}

function loadCdnDependencies(callback) {
  let chartNeeded = typeof Chart === 'undefined';
  if (!chartNeeded) {
    if (callback) callback();
    return;
  }

  const s1 = document.createElement('script');
  s1.src = 'https://cdn.jsdelivr.net/npm/chart.js';
  s1.onload = () => { if (callback) callback(); };
  document.head.appendChild(s1);
}

function startSpkluApp() {
  initNavbar();
  initHeroCanvas();
  initFormHandler();
  initRevenueCounter();
  initCharts();
  initSimulator();
  initFeasibilityScanner();
  initTcsChatbot();
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', () => loadCdnDependencies(startSpkluApp));
} else {
  loadCdnDependencies(startSpkluApp);
}
</script>
