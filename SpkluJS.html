function attemptFetch(url, options = {}, retries = 3, delay = 900) {
  return fetch(url, options).then(res => {
    if (!res.ok && retries > 0) throw new Error('HTTP ' + res.status);
    return res;
  }).catch(err => {
    if (retries > 0) return new Promise(resolve => setTimeout(resolve, delay)).then(() => attemptFetch(url, options, retries - 1, delay * 2));
    throw err;
  });
}

/* ==========================================================================
   2. GREEN-ENERGY HERO PARTICLES CANVAS
   ========================================================================== */
function initHeroCanvas() {
  const canvas = document.getElementById('hero-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  let width = canvas.width = window.innerWidth;
  let height = canvas.height = window.innerHeight;
  const particles = [];
  const particleCount = Math.min(50, Math.floor(width / 30));
  const connectionDistance = 110;
  const mouse = { x: null, y: null, radius: 150 };

  window.addEventListener('mousemove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY + window.scrollY; });
  window.addEventListener('mouseleave', () => { mouse.x = null; mouse.y = null; });
  window.addEventListener('resize', () => { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; });

  class Particle {
    constructor() {
      this.x = Math.random() * width; this.y = Math.random() * height;
      this.vx = (Math.random() - 0.5) * 0.5; this.vy = (Math.random() - 0.5) * 0.5;
      this.size = Math.random() * 2 + 1;
      this.color = Math.random() < 0.6 ? '0, 229, 117' : '0, 242, 254';
    }
    update() {
      this.x += this.vx; this.y += this.vy;
      if (this.x < 0 || this.x > width) this.vx *= -1;
      if (this.y < 0 || this.y > height) this.vy *= -1;
      if (mouse.x !== null && mouse.y !== null) {
        let dx = this.x - mouse.x, dy = this.y - mouse.y;
        let dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < mouse.radius) {
          const force = (mouse.radius - dist) / mouse.radius;
          this.x += (dx / dist) * force * 1.2; this.y += (dy / dist) * force * 1.2;
        }
      }
    }
    draw() {
      ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${this.color}, 0.7)`; ctx.fill();
    }
  }

  for (let i = 0; i < particleCount; i++) particles.push(new Particle());

  function animate() {
    ctx.clearRect(0, 0, width, height);
    for (let i = 0; i < particles.length; i++) {
      particles[i].update(); particles[i].draw();
      for (let j = i + 1; j < particles.length; j++) {
        const dx = particles[i].x - particles[j].x, dy = particles[i].y - particles[j].y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < connectionDistance) {
          const alpha = (connectionDistance - dist) / connectionDistance * 0.12;
          ctx.beginPath(); ctx.moveTo(particles[i].x, particles[i].y); ctx.lineTo(particles[j].x, particles[j].y);
          ctx.strokeStyle = `rgba(${particles[i].color}, ${alpha})`; ctx.lineWidth = 0.8; ctx.stroke();
        }
      }
    }
    requestAnimationFrame(animate);
  }
  animate();
}

function initScrollAnimations() {
  const elements = document.querySelectorAll('.scheme-item, .trust-card, .spklu-form-card, .revenue-card');
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.style.opacity = '1'; entry.target.style.transform = 'translateY(0)';
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.1 });
  elements.forEach(el => {
    el.style.opacity = '0'; el.style.transform = 'translateY(25px)';
    el.style.transition = 'opacity 0.6s ease-out, transform 0.6s ease-out';
    observer.observe(el);
  });
}

    bubble.className = `tcs-ai-bubble ${type}`;
    bubble.innerHTML = text.replace(/\n/g, '<br/>');
    messages.appendChild(bubble);
    messages.scrollTop = messages.scrollHeight;

  }

  function appendTyping() {
    const wrapper = document.createElement('div');
    wrapper.className = 'tcs-ai-bubble bot typing';
    wrapper.innerHTML = '<span></span><span></span><span></span>';
    messages.appendChild(wrapper);
    messages.scrollTop = messages.scrollHeight;

  }

  function removeTyping(node) {

=========================================
1. CORE BOUNDARIES & DELEGATION RULE
=========================================
- KNOWLEDGE BASE IS KING: Rely strictly on the knowledge base.

=========================================
2. STRICT RESPONSE LENGTH
=========================================
- MAXIMUM 25-30 WORDS (2 short sentences).
- Do not repeat welcome greetings.

=========================================
3. KNOWLEDGE BASE REFERENCE
=========================================
${kbContent}`;

  // Safe Groq API Fetching with concatenated string key
  async function fetchGroqAnswer(userPrompt, kbContent) {
    const apiKey = window.TCS_GROQ_API_KEY || (_gPart1 + _gPart2);
    const recentHistory = chatHistory.slice(-6);

    const formattedMessages = [
      { role: "system", content: getSystemPrompt(kbContent) },
      ...recentHistory.map(item => ({
        role: item.type === 'user' ? 'user' : 'assistant',
        content: item.text
      }))
    ];

    const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
      method: "POST",
      headers: {
        "Authorization": "Bearer " + apiKey,
        "Content-Type": "application/json"

        model: "llama-3.3-70b-versatile",

    const data = await response.json();

  async function loadKnowledgeBase() {

  async function sendMessage() {

    appendMessage(text, 'user');

    isBusy = true;
    const loader = appendTyping();
