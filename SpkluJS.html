// Helper to get qualitative EV description based on count
function getEvDescription(evCount, lang) {
  const isEn = lang === 'en';
  if (evCount >= 4000) {
    return isEn ? "Abundant" : "Melimpah";
  } else if (evCount >= 2000) {
    return isEn ? "Quite Many" : "Cukup Banyak";
  } else if (evCount >= 1000) {
    return isEn ? "Adequate" : "Cukup";
  } else if (evCount >= 500) {
    return isEn ? "Lacking" : "Kurang";
  } else {
    return isEn ? "Very Few" : "Sangat Sedikit";
  }
}

// Global retrying fetch helper used by map scanner and geocoding calls
function attemptFetch(url, options = {}, retries = 3, delay = 900) {
  return fetch(url, options).then(res => {
    if (!res.ok && retries > 0) throw new Error('HTTP ' + res.status);
    return res;
  }).catch(err => {
    if (retries > 0) return new Promise(resolve => setTimeout(resolve, delay)).then(() => attemptFetch(url, options, retries - 1, delay * 2));
    throw err;
  });
}

/* ==========================================================================
   2. GREEN-ENERGY HERO PARTICLES CANVAS
   ========================================================================== */
function initHeroCanvas() {
  const canvas = document.getElementById('hero-canvas');
  if (!canvas) return;
  
  const ctx = canvas.getContext('2d');
  let width = canvas.width = window.innerWidth;
  let height = canvas.height = window.innerHeight;
  
  const particles = [];
  const particleCount = Math.min(50, Math.floor(width / 30));
  const connectionDistance = 110;
  
  const mouse = { x: null, y: null, radius: 150 };
  
  window.addEventListener('mousemove', (e) => {
    mouse.x = e.clientX;
    mouse.y = e.clientY + window.scrollY;
  });
  
  window.addEventListener('mouseleave', () => {
    mouse.x = null;
    mouse.y = null;
  });
  
  window.addEventListener('resize', () => {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
  });
  
  class Particle {
    constructor() {
      this.x = Math.random() * width;
      this.y = Math.random() * height;
      this.vx = (Math.random() - 0.5) * 0.5;
      this.vy = (Math.random() - 0.5) * 0.5;
      this.size = Math.random() * 2 + 1;
      
      const r = Math.random();
      this.color = r < 0.6 ? '0, 229, 117' : '0, 242, 254';
    }
    
    update() {
      this.x += this.vx;
      this.y += this.vy;
      
      if (this.x < 0 || this.x > width) this.vx *= -1;
      if (this.y < 0 || this.y > height) this.vy *= -1;
      
      if (mouse.x !== null && mouse.y !== null) {
        let dx = this.x - mouse.x;
        let dy = this.y - mouse.y;
        let dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < mouse.radius) {
          const force = (mouse.radius - dist) / mouse.radius;
          this.x += (dx / dist) * force * 1.2;
          this.y += (dy / dist) * force * 1.2;
        }
      }
    }
    
    draw() {
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${this.color}, 0.7)`;
      ctx.fill();
    }
  }
  
  for (let i = 0; i < particleCount; i++) {
    particles.push(new Particle());
  }
  
  function animate() {
    ctx.clearRect(0, 0, width, height);
    for (let i = 0; i < particles.length; i++) {
      particles[i].update();
      particles[i].draw();
      
      for (let j = i + 1; j < particles.length; j++) {
        const dx = particles[i].x - particles[j].x;
        const dy = particles[i].y - particles[j].y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        
        if (dist < connectionDistance) {
          const alpha = (connectionDistance - dist) / connectionDistance * 0.12;
          ctx.beginPath();
          ctx.moveTo(particles[i].x, particles[i].y);
          ctx.lineTo(particles[j].x, particles[j].y);
          ctx.strokeStyle = `rgba(${particles[i].color}, ${alpha})`;
          ctx.lineWidth = 0.8;
          ctx.stroke();
        }
      }
    }
    requestAnimationFrame(animate);
  }
  animate();
}

function initScrollAnimations() {
  const elements = document.querySelectorAll('.scheme-item, .trust-card, .spklu-form-card, .revenue-card, .timelapse-container');
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.style.opacity = '1';
        entry.target.style.transform = 'translateY(0)';
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.1 });
  
  elements.forEach(el => {
    el.style.opacity = '0';
    el.style.transform = 'translateY(25px)';
    el.style.transition = 'opacity 0.6s ease-out, transform 0.6s ease-out';
    observer.observe(el);
  });
}

function initRevenueCounter() {
  const counterEl = document.getElementById('live-revenue-val');
  if (!counterEl) return;
  
  window.spkluCurrentRevenue = 1482900000;
  let displayVal = window.spkluCurrentRevenue - 8500000;
  
  function formatRupiah(num) {
    const currentLang = localStorage.getItem('tcs_lang') || 'id';
    return currentLang === 'en' ? 'IDR ' + num.toLocaleString('en-US') : 'Rp ' + num.toLocaleString('id-ID');
  }
  
  window.spkluFormatRevenue = formatRupiah;
  const duration = 2000;
  const startTime = performance.now();
  
  function countUp(timestamp) {
    const elapsed = timestamp - startTime;
    const progress = Math.min(elapsed / duration, 1);
    const ease = 1 - Math.pow(1 - progress, 3);
    const val = Math.floor(displayVal + (window.spkluCurrentRevenue - displayVal) * ease);
    
    counterEl.innerText = formatRupiah(val);
    if (progress < 1) {
      requestAnimationFrame(countUp);
    } else {
      counterEl.innerText = formatRupiah(window.spkluCurrentRevenue);
    }
  }
  requestAnimationFrame(countUp);
}

    messages.appendChild(wrapper);
    messages.scrollTop = messages.scrollHeight;
    return wrapper;
  }

  function removeTyping(node) {
    if (node && node.parentNode) node.parentNode.removeChild(node);
  }

  // System Prompt Master for TIARA
  function getSystemPrompt(kbContent) {
    const activeWa = window.tcsContactSettings ? window.tcsContactSettings.TCS_SALES_WHATSAPP || "628111978888" : "628111978888";
    
    return `You are TIARA, the official AI Senior Business Consultant at PT TCS (PT Titis Cahaya Sejahtera - Specialist in SPKLU Franchise, MEP Construction & Network Partnerships).

=========================================

  async function fetchGeminiAnswer(userPrompt, kbContent) {
    // Membaca API Key dari variabel global window tanpa hardcoded string
    const apiKey = (window.TCS_GEMINI_API_KEY || '').trim();
    if (!apiKey) throw new Error("API Key missing");

    const payload = {
      systemInstruction: {
        parts: [{ text: getSystemPrompt(kbContent) }]
      },
      contents: chatHistory.map(item => ({
        role: item.type === 'user' ? 'user' : 'model',
        parts: [{ text: item.text }]
      })),
      generationConfig: {
        temperature: 0.2,
        maxOutputTokens: 500, // Token limit aman untuk mencegah truncation
        topK: 1,
        topP: 0.85
      }
    };

    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(apiKey)}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });

    const data = await response.json();
    return data?.candidates?.[0]?.content?.parts?.map(p => p.text || '').join('\n') || '';

  async function loadKnowledgeBase() {
    if (knowledgeBaseText) return knowledgeBaseText;
    try {
      const primary = await fetch('KNOWLEDGE_BASE.md', { cache: 'no-store' });
      if (primary.ok) {
        knowledgeBaseText = await primary.text();
        return knowledgeBaseText;
      }
    } catch (e) {
      console.warn("Falling back to internal knowledge base");

    knowledgeBaseText = `PT TCS SPKLU KNOWLEDGE BASE:

    - Land requirement: 50-150 m2 (min 2-4 parking bays).
    - Power setup: AC 22kW or DC 50kW Fast Charging.
    - BEP Timeline: ~1.5 to 3.5 years depending on utilization.`;
    return knowledgeBaseText;
  }

  async function sendMessage() {
    const text = input.value.trim();
    if (!text || isBusy) return;

    appendMessage(text, 'user');
    input.value = '';

    isBusy = true;
    const loader = appendTyping();

    try {
      const kb = await loadKnowledgeBase();
      let answer = await fetchGeminiAnswer(text, kb);

      // Clean up any rogue greeting repetitions if generated by chance
      answer = answer.replace(/^(Halo|Hai|Selamat pagi|Selamat siang)!?\s*(Saya TIARA,?\s*)?/i, '');

      removeTyping(loader);
      appendMessage(answer.trim(), 'bot');
    } catch (error) {
      console.warn("Gemini API call failed, using smart fallback:", error);
      removeTyping(loader);
      appendMessage(getStaticFallbackAnswer(text), 'bot');
    } finally {
      isBusy = false;
    }
  }

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      sendMessage();
    }
  });

  sendBtn.addEventListener('click', sendMessage);

  document.addEventListener('click', (e) => {
    if (!isOpen) return;
    if (!panel.contains(e.target) && !toggle.contains(e.target)) {

      setPanelState();
    }
  });
